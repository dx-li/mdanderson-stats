[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdanderson-stats"
version = "0.1.0"
description = "Python implementations of methods in the MD Anderson biostatistics software catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/mdanderson_stats"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "mdanderson_stats/THIRD_PARTY_NOTICES.md"
"notices" = "mdanderson_stats/notices"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
